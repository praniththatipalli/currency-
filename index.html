<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Special Offer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .offer-card {
            background: white;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
            padding: 20px;
        }

        .offer-card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
        }

        .offer-title {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }

        .price {
            font-size: 22px;
            color: green;
            font-weight: bold;
        }

        .old-price {
            font-size: 14px;
            color: gray;
            text-decoration: line-through;
            margin-left: 5px;
        }

        .badge {
            background: red;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
        }

        button {
            margin-top: 15px;
            background: #2874f0;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1a5fd0;
        }

        .note {
            margin-top: 10px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="offer-card">
    <span class="badge">LIMITED OFFER</span>

    <img src="https://via.placeholder.com/300x220?text=iPhone+15+Pro+Max">

    <div class="offer-title">iPhone 15 Pro Max</div>

    <div>
        <span class="price">₹1</span>
        <span class="old-price">₹1,59,900</span>
    </div>

    <button>Grab Offer</button>

    <div class="note">
        * Demo offer UI only. Not a real sale.
    </div>
</div>

</body>
</html>
