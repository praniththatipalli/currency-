<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Explorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
        }

        header {
            background: #020617;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            color: #38bdf8;
        }

        header input {
            padding: 8px;
            width: 200px;
            border-radius: 5px;
            border: none;
        }

        main {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie {
            background: #020617;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .movie:hover {
            transform: scale(1.05);
        }

        .movie img {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-info h3 {
            font-size: 16px;
            margin: 0;
        }

        .movie-info span {
            float: right;
            padding: 3px 6px;
            border-radius: 5px;
            font-size: 12px;
        }

        .green { background: #16a34a; }
        .orange { background: #f59e0b; }
        .red { background: #dc2626; }

        .overview {
            padding: 10px;
            font-size: 13px;
            display: none;
        }

        .movie:hover .overview {
            display: block;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #020617;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<header>
    <h1>🎬 Movie Explorer</h1>
    <input type="text" id="search" placeholder="Search movies...">
</header>

<main id="main"></main>

<footer>
    Data provided by The Movie Database (TMDB)
</footer>

<script>
    const API_KEY = "YOUR_API_KEY_HERE";
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/w500";
    const POPULAR_URL = `${BASE_URL}/movie/popular?api_key=${API_KEY}`;
    const SEARCH_URL = `${BASE_URL}/search/movie?api_key=${API_KEY}&query=`;

    const main = document.getElementById("main");
    const search = document.getElementById("search");

    getMovies(POPULAR_URL);

    async function getMovies(url) {
        const res = await fetch(url);
        const data = await res.json();
        showMovies(data.results);
    }

    function showMovies(movies) {
        main.innerHTML = "";

        movies.forEach(movie => {
            const { title, poster_path, vote_average, overview } = movie;

            const movieEl = document.createElement("div");
            movieEl.classList.add("movie");

            movieEl.innerHTML = `
                <img src="${poster_path ? IMG_URL + poster_path : 'https://via.placeholder.com/300x450'}">
                <div class="movie-info">
                    <h3>${title}</h3>
                    <span class="${getClassByRate(vote_average)}">${vote_average.toFixed(1)}</span>
                </div>
                <div class="overview">
                    <strong>Overview:</strong>
                    <p>${overview}</p>
                </div>
            `;

            main.appendChild(movieEl);
        });
    }

    function getClassByRate(vote) {
        if (vote >= 8) return "green";
        if (vote >= 5) return "orange";
        return "red";
    }

    search.addEventListener("keyup", (e) => {
        if (search.value.trim()) {
            getMovies(SEARCH_URL + search.value);
        } else {
            getMovies(POPULAR_URL);
        }
    });
</script>

</body>
</html>
